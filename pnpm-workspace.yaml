packages:
  - 'sveltekit-app'
  - 'studio'
allowBuilds:
  esbuild: true
overrides:
  '@typescript-eslint/typescript-estree>minimatch@9.0.3': ^9.0.9
  '@vercel/frameworks>js-yaml': ^3.15.2
  '@vercel/frameworks>smol-toml': ^1.9.1
patchedDependencies:
